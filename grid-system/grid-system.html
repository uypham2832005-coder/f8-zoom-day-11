<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>12-Column Flex Grid System</title>
        <link rel="stylesheet" href="css/grid.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="bs-container" aria-label="12-column grid demonstration">
            <!-- Row 1: 1 item, spanning all 12 columns -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-12">1</div>
            </section>

            <!-- Row 2: 2 items, each spanning 6 columns -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-6">2</div>
                <div class="bs-row-item bs-col-6">3</div>
            </section>

            <!-- Row 3: 3 items, each spanning 4 columns -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-4">4</div>
                <div class="bs-row-item bs-col-4">5</div>
                <div class="bs-row-item bs-col-4">6</div>
            </section>

            <!-- Row 4: 4 items, each spanning 3 columns -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-3">7</div>
                <div class="bs-row-item bs-col-3">8</div>
                <div class="bs-row-item bs-col-3">9</div>
                <div class="bs-row-item bs-col-3">10</div>
            </section>

            <!-- Row 5: 6 items, each spanning 2 columns -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-2">11</div>
                <div class="bs-row-item bs-col-2">12</div>
                <div class="bs-row-item bs-col-2">13</div>
                <div class="bs-row-item bs-col-2">14</div>
                <div class="bs-row-item bs-col-2">15</div>
                <div class="bs-row-item bs-col-2">16</div>
            </section>

            <!-- Row 6: 12 items, each spanning 1 column -->
            <section class="bs-row">
                <div class="bs-row-item bs-col-1">17</div>
                <div class="bs-row-item bs-col-1">18</div>
                <div class="bs-row-item bs-col-1">19</div>
                <div class="bs-row-item bs-col-1">20</div>
                <div class="bs-row-item bs-col-1">21</div>
                <div class="bs-row-item bs-col-1">22</div>
                <div class="bs-row-item bs-col-1">23</div>
                <div class="bs-row-item bs-col-1">24</div>
                <div class="bs-row-item bs-col-1">25</div>
                <div class="bs-row-item bs-col-1">26</div>
                <div class="bs-row-item bs-col-1">27</div>
                <div class="bs-row-item bs-col-1">28</div>
            </section>
        </main>
    </body>
</html>
